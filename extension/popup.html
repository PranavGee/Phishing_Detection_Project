<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhishGuard</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header class="head">
  <div class="brand">
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <span>PhishGuard</span>
  </div>
  <label class="switch" title="Turn protection on or off">
    <input type="checkbox" id="toggle-enabled" checked>
    <span class="slider"></span>
  </label>
</header>

<section id="current" class="current">
  <div class="ring">
    <svg width="74" height="74" viewBox="0 0 74 74">
      <circle cx="37" cy="37" r="31" fill="none" stroke="#26325a" stroke-width="7"/>
      <circle id="ring-fill" cx="37" cy="37" r="31" fill="none" stroke="#10a45c"
              stroke-width="7" stroke-linecap="round"
              stroke-dasharray="0 999" transform="rotate(-90 37 37)"/>
    </svg>
    <b id="ring-score">--</b>
  </div>
  <div class="current-text">
    <strong id="verdict-title">Checking this page…</strong>
    <span id="verdict-host"></span>
    <span id="verdict-note" class="note"></span>
  </div>
</section>

<section class="scanbox">
  <input id="manual-url" type="text" placeholder="Check another link…" spellcheck="false">
  <button id="manual-btn" type="button">Scan</button>
</section>
<div id="manual-result" class="manual-result hidden"></div>

<section class="stats">
  <div><b id="stat-scanned">0</b><span>Scanned</span></div>
  <div><b id="stat-blocked">0</b><span>Blocked</span></div>
  <div><b id="stat-proceeded">0</b><span>Overridden</span></div>
</section>

<section class="controls">
  <button id="btn-trust" class="ghost" type="button">Always trust this site</button>
  <div class="threshold">
    <label for="threshold">Sensitivity
      <em id="threshold-value">0.70</em>
    </label>
    <input type="range" id="threshold" min="0.3" max="0.9" step="0.05" value="0.7">
    <div class="scale"><span>Warn more</span><span>Warn less</span></div>
  </div>
</section>

<footer class="foot">
  <a href="#" id="open-options">Options</a>
  <span id="model-note">on-device model</span>
</footer>

<script src="lib/features.js"></script>
<script src="popup.js"></script>
</body>
</html>
